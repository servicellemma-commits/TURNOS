<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KODA</title>
<meta name="theme-color" content="#fbeaf0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../css/style.css?v=20261026i">
<style>
#koda{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(160deg,#2f6fd6,#15876a);color:#fff;font-family:'Baloo 2','Nunito Sans',sans-serif;transition:opacity .45s}
#koda.fuera{opacity:0;pointer-events:none}
#koda .k{width:84px;height:84px;border-radius:24px;background:#fff;color:#2f6fd6;font:800 46px 'Baloo 2',sans-serif;display:flex;align-items:center;justify-content:center;animation:koda-pop .5s ease-out}
#koda b{font:800 38px 'Baloo 2',sans-serif;letter-spacing:6px}
#koda span{font-size:13px;opacity:.9}
@keyframes koda-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="koda" aria-hidden="true"><div class="k">K</div><b>KODA</b><span>Agenda para profesionales</span></div>
<main class="wrap" id="app"><div class="card"><p class="muted">Cargando…</p></div></main>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="../js/doctora.js?v=20261026i"></script>
<script>
// Presentación: se muestra un instante al abrir la app y se va sola
(function(){var e=document.getElementById('koda'),v=false;try{v=sessionStorage.getItem('kodaVisto')==='1';sessionStorage.setItem('kodaVisto','1')}catch(_){}
if(v){e.remove();return}
setTimeout(function(){e.classList.add('fuera');setTimeout(function(){e.remove()},500)},1300)})();
</script>
</body>
</html>
