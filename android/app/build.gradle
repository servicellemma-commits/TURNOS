plugins { id 'com.android.application' }
android {
    namespace 'ar.turnos.consultorio'
    compileSdk 34
    defaultConfig {
        applicationId 'ar.turnos.consultorio'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('APK_VERSION') ?: '1')
        versionName '1.' + (System.getenv('APK_VERSION') ?: '1')
    }
    signingConfigs {
        release {
            if (System.getenv('KS_PATH')) {
                storeFile file(System.getenv('KS_PATH')); storePassword System.getenv('KS_PASS')
                keyAlias 'turnos'; keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
