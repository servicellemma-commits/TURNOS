name: Armar APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - name: Llave de firma
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/turnos.jks
      - name: Llave de firma (nueva en cada armado)
        run: |
          echo "KS_PASS=$(openssl rand -hex 12)" >> $GITHUB_ENV
          echo "KS_PATH=$RUNNER_TEMP/turnos.jks" >> $GITHUB_ENV
      - run: keytool -genkeypair -keystore "$KS_PATH" -alias turnos -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Turnos"
      - name: Armar
        working-directory: android
        env:
          APK_VERSION: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Publicar
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Turnos.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Turnos.apk --title "App para Android" --notes "Descargá Turnos.apk e instalala en el celular."
